<html lang="en">

<title>Application and Rules · Gamino Real Estate</title>
<style>
:root{--ink:#1b1b1b;--muted:#5f5a52;--line:#d9d2c5;--bg:#fbf8f2;--card:#fff;--brand:#0f5c4d;--brand2:#0b4a3e;--warn:#9a3412;--ok:#166534}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
header b{font-size:18px;flex:1}
header button{background:#fff;color:var(--brand);border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px}
.bar{height:6px;background:#cfe3dd}.bar i{display:block;height:100%;background:#f2b134;transform-origin:left;transform:scaleX(0);transition:transform .3s}
main{max-width:760px;margin:0 auto;padding:20px 16px 140px}
h1{font-size:30px;line-height:1.2;margin:8px 0 6px}h2{font-size:23px;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;margin:0 0 16px}
label{display:block;font-weight:600;margin:12px 0 6px;font-size:18px}
input,select,textarea{width:100%;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #f2b13466;border-color:var(--brand)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.units{display:grid;gap:12px}
.unit{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;font:inherit;color:inherit}
.unit img{width:96px;height:72px;object-fit:cover;border-radius:10px;flex:none}
.unit.sel{border-color:var(--brand);box-shadow:0 0 0 3px #0f5c4d33}
.unit b{display:block;font-size:19px}.unit span{color:var(--muted);font-size:16px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600}
.check{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:30px;height:30px;flex:none;margin-top:2px;accent-color:var(--brand)}
.check div{font-size:18px}.check small{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.rule h2{margin-top:4px}.rule ul{padding-left:22px;margin:8px 0}.rule li{margin:6px 0}
.init{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.init input{width:130px;text-transform:uppercase;text-align:center;font-weight:800;font-size:24px;letter-spacing:2px}
.init span{font-weight:700}
.sig{border:2px solid var(--ink);border-radius:12px;background:#fff;touch-action:none;width:100%;height:220px;display:block}
.sigtools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:16px}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:700;text-decoration:underline;padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fffdf8ee;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
nav .in{max-width:760px;margin:0 auto;display:flex;gap:12px}
.btn{flex:1;border:0;border-radius:14px;padding:18px;font:inherit;font-weight:800;font-size:20px}
.next{background:var(--brand);color:#fff}.next:active{background:var(--brand2)}.next:disabled{background:#9db8b1}
.back{flex:0 0 32%;background:#ece6da;color:var(--ink)}
.err{color:var(--warn);font-weight:700;margin:10px 0 0;min-height:1em}
.done{text-align:center;padding-top:30px}.done .big{font-size:64px}
.small{font-size:15px;color:var(--muted)}
.hide{display:none!important}
@media print{header,nav,.bar,.noprint{display:none!important}main{padding:0}.card{break-inside:avoid}}
</style>

    S.units = (Array.isArray(rows)?rows:[]).filter(u=>u.unit_type!=="commercial");
    const want = new URLSearchParams(location.search).get("unit");
    if(want){ S.unit = S.units.find(u=>u.unit_id===want) || null; }
  }catch(e){ S.units=[]; }
  render();
}

function field(id,label,type="text",req=false,extra=""){
  return `<label for="${id}">${esc(label)}${req?" *":""}</label><input id="${id}" type="${type}" ${extra} value="${esc(S.a[id]||"")}" ${req?"required":""}>`;
}
function yn(id,label){
  const v=S.a[id]||""; return `<label for="${id}">${esc(label)}</label><select id="${id}"><option value=""></option><option ${v==="yes"?"selected":""} value="yes">${tt("yes")}</option><option ${v==="no"?"selected":""} value="no">${tt("no")}</option></select>`;
}

function render(){
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=tt(e.dataset.t));
  document.documentElement.lang=L; document.getElementById("langBtn").textContent = L==="es"?"English":"Español";
  const st = steps(), cur = st[S.step];
  document.getElementById("prog").style.transform = "scaleX("+(S.step/(st.length-1))+")";
  const back=document.getElementById("backBtn"), next=document.getElementById("nextBtn");
  back.textContent=tt("back"); back.classList.toggle("hide", S.step===0 || cur==="done");
  next.textContent = cur===lastSig() ? tt("submit") : tt("next"); next.disabled=false;
  document.querySelector("nav").classList.toggle("hide", cur==="done");
  let h = "";
  if(cur==="pick"){
    h += `<h1>${tt("pickT")}</h1><p class="sub">${tt("pickS")}</p><div class="units">`;
    if(!S.units.length) h += `<p>${tt("loading")}</p>`;
    for(const u of S.units){
      h += `<button type="button" class="unit ${S.unit&&S.unit.unit_id===u.unit_id?"sel":""}" data-u="${u.unit_id}">${u.photo?`<img alt="" src="${esc(u.photo)}">`:""}<div><b>${esc(u.address)} · #${esc(u.unit_number)}</b><span>${esc(L==="es"?u.title_es:u.title_en)} · $${Number(u.rent||0).toLocaleString()}/mo</span></div></button>`;
    }
    h += `</div><p class="err" id="err"></p>`;
  } else if(cur==="apt"){
    const u=S.unit;
    h += `<h1>${tt("aptT")}</h1><p class="sub">${tt("aptS")}</p><div class="card"><dl class="facts">
      <dt>${tt("address")}</dt><dd>${esc(u.address)}, Milwaukee, WI ${esc(u.zip)}</dd>
      <dt>${tt("unit")}</dt><dd>#${esc(u.unit_number)}</dd>
      <dt>${tt("beds")}</dt><dd>${esc(u.bedrooms??"-")} / ${esc(u.bathrooms??"-")}</dd>
      <dt>${tt("rent")}</dt><dd>$${Number(u.rent||0).toLocaleString()}</dd>
      <dt>${tt("ends")}</dt><dd>${CONFIG.leaseEnd[L]}</dd></dl></div>
      <div class="card">${field("move_in",tt("movein"),"date",true)}</div><p class="err" id="err"></p>`;
  } else if(cur==="you"){
    h += `<h1>${tt("youT")}</h1><p class="sub">${tt("youS")}</p><div class="card">
      ${field("full_name",tt("name"),"text",true,'autocomplete="name"')}
      <div class="row"><div>${field("phone",tt("phone"),"tel",true,'autocomplete="tel" inputmode="tel"')}</div><div>${field("email",tt("email"),"email",true,'autocomplete="email" inputmode="email"')}</div></div>
      <div class="row"><div><label for="language">${tt("lang")}</label><select id="language"><option ${S.a.language!=="English"?"selected":""}>Español</option><option ${S.a.language==="English"?"selected":""}>English</option></select></div><div>${field("dob",tt("dob"),"date")}</div></div>
      ${field("emergency_name",tt("emer"))}
      <div class="row"><div>${field("emergency_phone",tt("emerP"),"tel",false,'inputmode="tel"')}</div><div>${field("emergency_rel",tt("emerR"))}</div></div></div><p class="err" id="err"></p>`;
  } else if(cur==="hh"){
    h += `<h1>${tt("hhT")}</h1><p class="sub">${tt("hhS")}</p><div class="card"><div class="row"><div>${field("adult2_name",tt("a2n"))}</div><div>${field("adult2_phone",tt("phone"),"tel",false,'inputmode="tel"')}</div></div><div class="row"><div>${field("adult3_name",tt("a3n"))}</div><div>${field("adult3_phone",tt("phone"),"tel",false,'inputmode="tel"')}</div></div>${field("children",tt("kids"))}${field("pets",tt("pets"))}${field("vehicles",tt("cars"))}</div>`;
  } else if(cur==="inc"){
    h += `<h1>${tt("incT")}</h1><p class="sub">${tt("incS")}</p><div class="card">
      <div class="row"><div>${field("employer",tt("employer"))}</div><div>${field("income",tt("income"),"text",false,'inputmode="decimal"')}</div></div>
      ${yn("voucher",tt("voucher"))}${field("current_address",tt("curAddr"))}${field("current_landlord",tt("curLL"))}${yn("evicted",tt("evict"))}</div>`;
  } else if(cur==="con"){
    const c=S.consents, item=(k,lab)=>`<label class="check"><input type="checkbox" data-c="${k}" ${c[k]?"checked":""}><div>${esc(lab)}</div></label>`;
    h += `<h1>${tt("conT")}</h1><p class="sub">${tt("conS")}</p><div class="card">${item("email",tt("cEmail"))}${item("sms",tt("cSms"))}${item("ai_calls",tt("cCall"))}
      <p class="small">${tt("cFine")}${CONFIG.office}. ${tt("cNot")}</p></div>`;
  } else if(cur.startsWith("rule:")){
    const r = RULES().find(x=>"rule:"+x.k===cur);
    h += `<div class="card rule"><h2>${esc(r.t[L])}</h2><ul>${r.b[L].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="init"><span>${tt("initL")}:</span><input id="init" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(S.initials[r.k]||"")}"></div></div><p class="err" id="err"></p>`;
  } else if(cur.startsWith("sigO:")){
    const k=cur.slice(5), o=S.others[k]||{};
    h += `<h1>${tt("sigOT")}: ${esc(S.a[k+"_name"])}</h1><p class="sub">${tt("sigOS")}</p>
      <div class="card"><div class="init" style="border:0;margin:0;padding:0"><span>${tt("initL")}:</span><input id="init" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(o.initials||"")}"></div></div>
      <div class="card"><canvas class="sig" id="pad"></canvas><div class="sigtools"><span>${tt("signHere")} · ${esc(S.a[k+"_name"])}</span><button class="link" type="button" id="clr">${tt("clear")}</button></div></div><p class="err" id="err"></p>`;
  } else if(cur==="sigR" || cur==="sigA"){
    const isR = cur==="sigR";
    h += `<h1>${tt(isR?"sigRT":"sigAT")}</h1><p class="sub">${tt(isR?"sigRS":"sigAS")}</p>
      <div class="card"><canvas class="sig" id="pad"></canvas><div class="sigtools"><span>${tt("signHere")} · ${esc(S.a.full_name||"")}</span><button class="link" type="button" id="clr">${tt("clear")}</button></div></div><p class="err" id="err"></p>`;
  } else if(cur==="done"){
    h += `<div class="done"><div class="big">✅</div><h1>${tt("doneT")}</h1><p class="sub">${tt("doneS")}</p><p class="small">${tt("ref")}: ${esc(S.id)}</p>
      <div class="card" style="text-align:left"><h2 style="margin-top:0">${tt("payNextT")}</h2><p>${tt("payNextS")} <b>${esc(CONFIG.zelle.name)}</b>, <b>${esc(CONFIG.zelle.phone)}</b>.</p><p class="small" style="margin-bottom:0">${tt("payNextK")}</p></div>
      <p class="noprint"><button class="btn next" type="button" onclick="window.print()">${tt("print")}</button></p>
      <p class="noprint"><button class="link" type="button" onclick="location.href=location.pathname+'?lang='+L">${tt("newApp")}</button></p></div>${summaryHTML()}`;
  }
  app.innerHTML = h; window.scrollTo(0,0);
  if(cur==="pick") app.querySelectorAll(".unit").forEach(b=>b.onclick=()=>{S.unit=S.units.find(u=>u.unit_id===b.dataset.u); render();});
  if(cur==="con") app.querySelectorAll("[data-c]").forEach(cb=>cb.onchange=()=>{S.consents[cb.dataset.c]=cb.checked;});
  if(isSig(cur)) setupPad(cur);
}

function summaryHTML(){
  const a=S.a, u=S.unit||{};
  const rows=[[tt("unit"),`${u.address||""} #${u.unit_number||""}`],[tt("movein"),a.move_in],[tt("name"),a.full_name],[tt("phone"),a.phone],[tt("email"),a.email],
    [tt("adults"),[a.adult2_name,a.adult3_name,a.other_adults].filter(Boolean).join(", ")],[tt("kids"),a.children],[tt("pets"),a.pets],[tt("employer"),a.employer],[tt("income"),a.income]];
  return `<div class="card" style="text-align:left"><dl class="facts">${rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1]||"-")}</dd>`).join("")}</dl>
    <p class="small">${RULES().map(r=>esc(r.t[L])+": "+esc(S.initials[r.k]||"")).join(" · ")}</p>
    ${[["sigR",tt("sigRT"),a.full_name],["sigA",tt("sigAT"),a.full_name],...Object.entries(S.others).map(([k,o])=>["o:"+k,tt("sigOT"),o.name])].map(([key,label,who])=>{
       const src=key.startsWith("o:")?S.others[key.slice(2)].sig:S[key]; if(!src) return "";
       const when=key.startsWith("o:")?S.others[key.slice(2)].at:S.sigAt[key];
       return `<div style="margin-top:14px"><p class="small" style="margin:0">${esc(label)}</p><img alt="" src="${src}" style="max-width:100%;height:110px;border-bottom:1.5px solid #111"><p style="margin:4px 0 0;font-weight:700">${esc(who||"")}</p><p class="small" style="margin:0">${tt("signedOn")}: ${esc(when||"")}</p></div>`; }).join("")}</div>`;
}

let pad=null;
function setupPad(which){
  const c=document.getElementById("pad"), ctx=c.getContext("2d"), dpr=window.devicePixelRatio||1;
  const r=c.getBoundingClientRect(); c.width=r.width*dpr; c.height=r.height*dpr; ctx.scale(dpr,dpr);
  ctx.lineWidth=3.6; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111";
  let drawing=false, inked=false, last=null;
  const pt=e=>{const b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};
  c.onpointerdown=e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId);};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;inked=true;};
  c.onpointerup=c.onpointercancel=()=>{drawing=false;};
  document.getElementById("clr").onclick=()=>{ctx.clearRect(0,0,c.width,c.height);inked=false;S[which]=null;};
  pad={get:()=>inked?c.toDataURL("image/png"):null};
  if(S[which]){const im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,r.width,r.height);inked=true;};im.src=S[which];}
}

function collect(){ app.querySelectorAll("input[id],select[id]").forEach(i=>{ if(i.id!=="init"&&i.id!=="pad") S.a[i.id]=i.value.trim(); }); }
function fail(k){ const e=document.getElementById("err"); if(e) e.textContent=tt(k); return false; }

function validate(cur){
  if(cur==="pick") return S.unit ? true : fail("pickS");
  if(cur==="apt"||cur==="you"){ collect(); const missing=[...app.querySelectorAll("[required]")].some(i=>!i.value.trim()); return missing?fail("req"):true; }
  if(cur==="hh"||cur==="inc"){ collect(); return true; }
  if(cur.startsWith("rule:")){ const v=document.getElementById("init").value.trim().toUpperCase(); if(v.length<2) return fail("initErr"); S.initials[cur.slice(5)]=v; return true; }
  if(cur==="sigR"||cur==="sigA"){ const d=pad&&pad.get(); if(!d) return fail("sigErr"); S[cur]=d; S.sigAt[cur]=new Date().toLocaleString(); return true; }
  if(cur.startsWith("sigO:")){ const k=cur.slice(5), iv=document.getElementById("init").value.trim().toUpperCase(); if(iv.length<2) return fail("initErr");
    const d=pad&&pad.get(); if(!d) return fail("sigErr");
    S.others[k]={name:S.a[k+"_name"], phone:S.a[k+"_phone"]||"", initials:iv, sig:d, at:new Date().toLocaleString()}; return true; }
  return true;
}

async function submit(){
  const next=document.getElementById("nextBtn"); next.disabled=true; next.textContent=tt("sending");
  const rules=RULES();
  const body={ p:{ unit_id:S.unit.unit_id, unit_label:`${S.unit.address} #${S.unit.unit_number}`, lang:L, applicant:S.a, consents:S.consents, initials:S.initials,
    rules_version:CONFIG.rulesVersion+"-latefee"+CONFIG.lateFee, rules_text:Object.fromEntries(rules.map(r=>[r.k,{title:r.t[L],text:r.b[L]}])),
    sig_rules:S.sigR, sig_application:S.sigA, user_agent:navigator.userAgent } };
  body.p.applicant = {...S.a, signed_at_local:S.sigAt, other_adults_signed:S.others};
  try{
    const r=await fetch(CONFIG.supabase+"/rest/v1/rpc/submit_signed_application",{method:"POST",headers:{apikey:CONFIG.key,authorization:"Bearer "+CONFIG.key,"content-type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json(); if(!r.ok) throw new Error(j&&j.message||"error");
    S.id=j; S.step++; render();
  }catch(e){ next.disabled=false; next.textContent=tt("submit"); fail("sendErr"); }
}

document.getElementById("nextBtn").onclick=()=>{
  const st=steps(), cur=st[S.step];
  if(!validate(cur)) return;
  if(cur===lastSig()) return submit();
  S.step++; render();
};
document.getElementById("backBtn").onclick=()=>{ const cur=steps()[S.step]; if(cur==="sigR"||cur==="sigA"){const d=pad&&pad.get(); if(d) S[cur]=d;} else if(!isSig(cur)) collect(); S.step=Math.max(0,S.step-1); render(); };
document.getElementById("langBtn").onclick=()=>{ const cur=steps()[S.step]; if(!cur.startsWith("rule:")&&!isSig(cur)) collect(); L=L==="es"?"en":"es"; render(); };
render(); loadUnits();
</script>
</body>
